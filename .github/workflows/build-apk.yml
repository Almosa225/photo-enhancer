name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK info
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms || true

      - name: Install
        run: npm ci

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
            code=${PIPESTATUS[0]}
            [ $code -eq 0 ] && break
            echo "Attempt $i failed, retrying in 20s..."; sleep 20
          done
          exit $code

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rfq --cached . >/dev/null
          tail -300 build.log > last-build.log
          git add -f last-build.log
          git commit -qm "build log"
          git push -f origin build-logs

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk photo-enhancer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: photo-enhancer-apk
          path: photo-enhancer.apk

      - name: Publish download (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Photo Enhancer v1.0.${{ github.run_number }}
          body: حمّل ملف photo-enhancer.apk من الأسفل وثبّته على جوالك.
          files: photo-enhancer.apk
