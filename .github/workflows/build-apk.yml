name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk photo-enhancer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: photo-enhancer-apk
          path: photo-enhancer.apk

      - name: Publish download (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Photo Enhancer v1.0.${{ github.run_number }}
          body: حمّل ملف photo-enhancer.apk من الأسفل وثبّته على جوالك.
          files: photo-enhancer.apk
